  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

─── */\n.q-intro {\n  background: var(--bg-deep);\n  padding: 56px 52px 52px;\n  position: relative;\n  overflow: hidden;\n}\n\n/* Constellation SVG overlay */\n.q-intro .constellation {\n  position: absolute;\n  top: 0; left: 0; right: 0; bottom: 0;\n  pointer-events: none;\n  opacity: 0.35;\n}\n\n/* Orange diagonal */\n.q-intro::after {\n  content: '';\n  position: absolute;\n  bottom: -20px; right: 64px;\n  width: 2px; height: 200px;\n  background: linear-gradient(to bottom, var(--accent-orange), transparent);\n  transform: rotate(-28deg);\n  pointer-events: none;\n}\n\n.intro-top { position: relative; z-index: 1; }\n\n.intro-eyebrow {\n  font-family: var(--font-display);\n  font-size: 11px;\n  font-weight: 500;\n  letter-spacing: 0.12em;\n  text-transform: uppercase;\n  color: var(--text-tertiary);\n  margin-bottom: 14px;\n}\n\n.intro-divider {\n  width: 240px; height: 1px;\n  background: var(--divider);\n  margin-bottom: 24px;\n}\n\n.intro-title {\n  font-family: var(--font-display);\n  font-weight: 300;\n  font-size: clamp(36px, 7vw, 52px);\n  color: var(--text-primary);\n  line-height: 1.05;\n  margin-bottom: 4px;\n}\n\n.intro-title .cyan {\n  color: var(--accent-cyan);\n  font-weight: 600;\n  display: block;\n}\n\n.intro-sub {\n  font-family: var(--font-display);\n  font-size: 14px;\n  font-weight: 400;\n  color: var(--text-secondary);\n  margin: 18px 0 32px;\n  line-height: 1.5;\n  max-width: 420px;\n}\n\n.intro-body {\n  font-size: 14px;\n  color: var(--text-secondary);\n  line-height: 1.85;\n  font-weight: 400;\n  margin-bottom: 36px;\n  max-width: 460px;\n  position: relative;\n  z-index: 1;\n}\n.intro-body strong { color: var(--text-primary); font-weight: 500; }\n\n/* Start button — ghost style per design system */\n.btn-start {\n  display: inline-flex;\n  align-items: center;\n  gap: 10px;\n  font-family: var(--font-display);\n  font-weight: 400;\n  font-size: 13px;\n  letter-spacing: 0.05em;\n  text-transform: lowercase;\n  color: var(--text-primary);\n  padding: 12px 32px;\n  border-radius: var(--radius-sharp);\n  background: transparent;\n  border: 1px solid var(--border-interactive);\n  cursor: pointer;\n  transition: background 0.2s ease, border-color 0.2s ease;\n  position: relative;\n  z-index: 1;\n}\n.btn-start:hover {\n  background: var(--accent-cyan-dim);\n  border-color: var(--border-bright);\n}\n.btn-start svg { flex-shrink: 0; }\n\n.intro-author {\n  margin-top: 44px;\n  padding-top: 24px;\n  border-top: 1px solid var(--border-subtle);\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  gap: 16px;\n  flex-wrap: wrap;\n  position: relative;\n  z-index: 1;\n}\n\n.intro-author-name {\n  font-family: var(--font-wordmark);\n  font-size: 15px;\n  font-weight: 700;\n  letter-spacing: 0.18em;\n  text-transform: uppercase;\n  color: var(--text-primary);\n  margin-bottom: 4px;\n}\n\n.intro-author-role {\n  font-family: var(--font-display);\n  font-size: 11px;\n  letter-spacing: 0.05em;\n  color: var(--text-tertiary);\n}\n\n.intro-url {\n  font-family: var(--font-display);\n  font-size: 12px;\n  color: var(--accent-cyan);\n  letter-spacing: 0.05em;\n  opacity: 0.65;\n}\n\n/* ── PROGRESS BAR ────────────────────────────────────────── */\n.q-progress {\n  background: var(--bg-mid);\n  padding: 12px 28px;\n  display: flex;\n  align-items: center;\n  gap: 14px;\n  border-bottom: 1px solid var(--border-subtle);\n  border-top: 1px solid var(--border-subtle);\n}\n\n.q-progress-label {\n  font-family: var(--font-display);\n  font-size: 10px;\n  font-weight: 500;\n  letter-spacing: 0.14em;\n  text-transform: uppercase;\n  color: var(--accent-cyan);\n  opacity: 0.65;\n  white-space: nowrap;\n  flex-shrink: 0;\n}\n\n.q-progress-track {\n  flex: 1;\n  height: 1px;\n  background: var(--border-subtle);\n}\n\n.q-progress-fill {\n  height: 100%;\n  background: var(--accent-cyan);\n  opacity: 0.5;\n  transition: width 0.4s ease;\n}\n\n.q-progress-count {\n  font-family: var(--font-display);\n  font-size: 11px;\n  color: var(--text-tertiary);\n  letter-spacing: 0.06em;\n  flex-shrink: 0;\n}\n\n/* ── QUESTION CARD ───────────────────────────────────────── */\n.q-card {\n  background: var(--bg-deep);\n  padding: 44px 48px 40px;\n}\n\n.q-eyebrow {\n  font-family: var(--font-display);\n  font-size: 11px;\n  font-weight: 500;\n  letter-spacing: 0.12em;\n  text-transform: uppercase;\n  color: var(--text-tertiary);\n  margin-bottom: 16px;\n}\n\n.q-num {\n  font-family: var(--font-display);\n  font-weight: 300;\n  font-size: 72px;\n  color: var(--border-subtle);\n  line-height: 1;\n  margin-bottom: 14px;\n  letter-spacing: -0.02em;\n}\n\n.q-title {\n  font-family: var(--font-display);\n  font-weight: 400;\n  font-size: 20px;\n  line-height: 1.3;\n  color: var(--text-primary);\n  margin-bottom: 8px;\n  text-wrap: pretty;\n}\n\n.q-tagline {\n  font-family: var(--font-display);\n  font-size: 11px;\n  font-weight: 500;\n  letter-spacing: 0.10em;\n  text-transform: uppercase;\n  color: var(--accent-cyan);\n  opacity: 0.7;\n  margin-bottom: 24px;\n}\n\n.q-rule {\n  width: 100%; height: 1px;\n  background: var(--border-subtle);\n  margin-bottom: 24px;\n}\n\n.q-body {\n  font-size: 14px;\n  color: var(--text-secondary);\n  line-height: 1.85;\n  font-weight: 400;\n  margin-bottom: 32px;\n  max-width: 480px;\n}\n\n/* Answer buttons */\n.q-answers {\n  display: grid;\n  grid-template-columns: 1fr 1fr;\n  gap: 10px;\n  margin-bottom: 24px;\n}\n\n.btn-answer {\n  padding: 14px 16px;\n  border: 1px solid var(--border-interactive);\n  background: transparent;\n  font-family: var(--font-display);\n  font-size: 13px;\n  font-weight: 400;\n  letter-spacing: 0.04em;\n  text-transform: lowercase;\n  cursor: pointer;\n  transition: all 0.18s ease;\n  line-height: 1.4;\n  color: var(--text-secondary);\n  text-align: center;\n  border-radius: var(--radius-sharp);\n}\n\n/* YES = orange accent on select */\n.btn-answer.yes:hover {\n  background: rgba(232,76,43,0.08);\n  border-color: rgba(232,76,43,0.5);\n  color: rgba(232,76,43,0.9);\n}\n.btn-answer.yes.selected {\n  background: rgba(232,76,43,0.10);\n  border-color: rgba(232,76,43,0.55);\n  color: rgba(232,76,43,0.95);\n}\n\n/* NO = cyan accent on select */\n.btn-answer.no:hover {\n  background: var(--accent-cyan-dim);\n  border-color: var(--border-bright);\n  color: var(--accent-cyan);\n}\n.btn-answer.no.selected {\n  background: var(--accent-cyan-dim);\n  border-color: var(--border-bright);\n  color: var(--accent-cyan);\n}\n\n/* Back button */\n.q-back {\n  display: inline-flex;\n  align-items: center;\n  gap: 6px;\n  background: none;\n  border: none;\n  font-family: var(--font-display);\n  font-size: 11px;\n  font-weight: 400;\n  color: var(--text-tertiary);\n  letter-spacing: 0.08em;\n  cursor: pointer;\n  padding: 0;\n  transition: color 0.2s ease;\n}\n.q-back:hover { color: var(--text-secondary); }\n\n/* ── RESULTS HEADER ──────────────────────────────────────── */\n.results-header {\n  background: var(--bg-deep);\n  padding: 48px 48px 44px;\n  position: relative;\n  overflow: hidden;\n}\n\n.results-header::after {\n  content: '';\n  position: absolute;\n  top: 0; right: 60px;\n  width: 2px; height: 200px;\n  background: linear-gradient(to bottom, var(--accent-orange), transparent);\n  transform: rotate(-28deg) translateX(20px);\n  pointer-events: none;\n}\n\n.results-header::before {\n  content: '';\n  position: absolute;\n  top: 0; right: 0;\n  width: 280px; height: 100%;\n  background: radial-gradient(ellipse at 80% 40%, rgba(34,212,245,0.05) 0%, transparent 70%);\n  pointer-events: none;\n}\n\n.results-eyebrow {\n  font-family: var(--font-display);\n  font-size: 11px;\n  font-weight: 500;\n  letter-spacing: 0.14em;\n  text-transform: uppercase;\n  color: var(--accent-cyan);\n  opacity: 0.8;\n  margin-bottom: 12px;\n}\n\n.results-divider {\n  width: 240px; height: 1px;\n  background: var(--divider);\n  margin-bottom: 24px;\n}\n\n.results-score-row {\n  display: flex;\n  align-items: flex-end;\n  gap: 12px;\n  margin-bottom: 20px;\n}\n\n.results-score-num {\n  font-family: var(--font-display);\n  font-weight: 300;\n  font-size: 88px;\n  line-height: 1;\n  letter-spacing: -0.02em;\n}\n.results-score-num.c-low  { color: var(--text-tertiary); }\n.results-score-num.c-mid  { color: var(--accent-cyan); }\n.results-score-num.c-high { color: #e06050; }\n\n.results-score-denom {\n  font-family: var(--font-display);\n  font-size: 18px;\n  font-weight: 400;\n  color: var(--text-tertiary);\n  padding-bottom: 14px;\n  letter-spacing: 0.04em;\n}\n\n.results-tier-badge {\n  display: inline-block;\n  border: 1px solid var(--border-subtle);\n  border-radius: var(--radius-sharp);\n  padding: 6px 14px;\n  margin-bottom: 18px;\n}\n\n.results-tier-name {\n  font-family: var(--font-display);\n  font-size: 11px;\n  font-weight: 500;\n  letter-spacing: 0.12em;\n  text-transform: uppercase;\n}\n.results-tier-name.c-low  { color: var(--text-tertiary); }\n.results-tier-name.c-mid  { color: var(--accent-cyan); }\n.results-tier-name.c-high { color: #e06050; }\n\n.results-tier-desc {\n  font-size: 14px;\n  color: var(--text-secondary);\n  line-height: 1.82;\n  font-weight: 400;\n  max-width: 440px;\n}\n.results-tier-desc strong { color: var(--text-primary); font-weight: 500; }\n\n/* ── RESULTS SIGNS ───────────────────────────────────────── */\n.results-body {\n  background: var(--bg-mid);\n  padding: 36px 48px 40px;\n  border-top: 1px solid var(--border-subtle);\n  border-bottom: 1px solid var(--border-subtle);\n}\n\n.results-body-label {\n  font-family: var(--font-display);\n  font-size: 11px;\n  font-weight: 500;\n  letter-spacing: 0.12em;\n  text-transform: uppercase;\n  color: var(--text-tertiary);\n  margin-bottom: 20px;\n}\n\n.sign-result-list {\n  list-style: none;\n  display: flex;\n  flex-direction: column;\n  gap: 8px;\n}\n\n.sign-result-item {\n  display: flex;\n  gap: 16px;\n  align-items: flex-start;\n  background: var(--bg-card);\n  border: 1px solid var(--border-subtle);\n  border-left: 2px solid rgba(232,76,43,0.5);\n  border-radius: 0 var(--radius-card) var(--radius-card) 0;\n  padding: 14px 18px;\n}\n\n.sign-result-num {\n  font-family: var(--font-display);\n  font-size: 11px;\n  font-weight: 500;\n  color: rgba(232,76,43,0.7);\n  flex-shrink: 0;\n  margin-top: 2px;\n  min-width: 16px;\n  letter-spacing: 0.06em;\n}\n\n.sign-result-tagline {\n  font-family: var(--font-display);\n  font-size: 12px;\n  font-weight: 500;\n  letter-spacing: 0.08em;\n  text-transform: uppercase;\n  color: rgba(232,76,43,0.8);\n  margin-bottom: 5px;\n}\n\n.sign-result-implication {\n  font-size: 13px;\n  color: var(--text-secondary);\n  line-height: 1.6;\n  font-weight: 400;\n}\n\n.result-none {\n  padding: 20px 22px;\n  background: var(--bg-card);\n  border: 1px solid var(--border-subtle);\n  border-left: 2px solid rgba(34,212,245,0.4);\n  border-radius: 0 var(--radius-card) var(--radius-card) 0;\n  font-size: 14px;\n  color: var(--text-secondary);\n  line-height: 1.7;\n  font-weight: 400;\n}\n\n/* ── RESULTS CTA ─────────────────────────────────────────── */\n.results-cta {\n  background: var(--bg-deep);\n  padding: 44px 48px;\n  text-align: center;\n  position: relative;\n  overflow: hidden;\n}\n\n.results-cta::before {\n  content: '';\n  position: absolute;\n  top: 0; left: 0; right: 0;\n  height: 2px;\n  background: linear-gradient(to right, var(--accent-cyan), transparent);\n}\n\n.results-cta-eyebrow {\n  font-family: var(--font-display);\n  font-size: 11px;\n  font-weight: 500;\n  letter-spacing: 0.14em;\n  text-transform: uppercase;\n  color: var(--accent-cyan);\n  opacity: 0.8;\n  margin-bottom: 10px;\n}\n\n.results-cta-divider {\n  width: 240px; height: 1px;\n  background: var(--divider);\n  margin: 0 auto 20px;\n}\n\n.results-cta-heading {\n  font-family: var(--font-display);\n  font-weight: 300;\n  font-size: clamp(22px, 4vw, 32px);\n  line-height: 1.2;\n  color: var(--text-primary);\n  margin-bottom: 14px;\n  max-width: 400px;\n  margin-left: auto;\n  margin-right: auto;\n  text-wrap: pretty;\n}\n.results-cta-heading em { font-style: italic; color: var(--text-secondary); }\n\n.results-cta-body {\n  font-size: 14px;\n  color: var(--text-secondary);\n  line-height: 1.82;\n  font-weight: 400;\n  max-width: 380px;\n  margin: 0 auto 32px;\n}\n\n.results-cta-btn {\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  font-family: var(--font-display);\n  font-weight: 400;\n  font-size: 13px;\n  letter-spacing: 0.05em;\n  text-transform: lowercase;\n  color: var(--text-primary);\n  padding: 12px 36px;\n  border-radius: var(--radius-sharp);\n  background: transparent;\n  border: 1px solid var(--border-interactive);\n  cursor: pointer;\n  transition: background 0.2s ease, border-color 0.2s ease;\n  text-decoration: none;\n  margin-bottom: 14px;\n}\n.results-cta-btn:hover {\n  background: var(--accent-cyan-dim);\n  border-color: var(--border-bright);\n}\n\n.results-cta-sub {\n  font-family: var(--font-display);\n  font-size: 11px;\n  color: var(--text-tertiary);\n  letter-spacing: 0.05em;\n}\n\n/* ── RETAKE ──────────────────────────────────────────────── */\n.results-retake {\n  background: var(--bg-mid);\n  padding: 18px 48px;\n  text-align: center;\n  border-top: 1px solid var(--border-subtle);\n}\n\n.btn-retake {\n  background: none;\n  border: none;\n  font-family: var(--font-display);\n  font-size: 11px;\n  font-weight: 400;\n  color: var(--text-tertiary);\n  letter-spacing: 0.10em;\n  text-transform: lowercase;\n  cursor: pointer;\n  transition: color 0.2s ease;\n}\n.btn-retake:hover { color: var(--text-secondary); }\n\n/* ── RESPONSIVE ──────────────────────────────────────────── */\n@media (max-width: 600px) {\n  body { padding: 0; }\n  #quiz { box-shadow: none; border: none; }\n\n  .q-intro, .results-header, .results-cta, .results-retake {\n    padding-left: 28px;\n    padding-right: 28px;\n  }\n\n  .q-card, .results-body { padding: 36px 28px 32px; }\n  .q-answers { grid-template-columns: 1fr; }\n  .results-score-num { font-size: 64px; }\n  .q-progress { padding-left: 20px; padding-right: 20px; }\n  .results-cta-heading { font-size: 22px; }\n}\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<div id=\"quiz\"><\u002Fdiv>\n\n<script>\nconst SIGNS = [\n  {\n    num: 1,\n    eyebrow: \"Sign One\",\n    tagline: \"The Bottleneck Is You\",\n    title: \"Every strategic decision routes through you — and the queue is backing up.\",\n    body: \"Your team is capable but waiting. Approvals, context, and key calls all funnel to you personally. And the decisions that <em>don't<\u002Fem> get escalated — because everyone knows you're at capacity — are often the ones that matter most.\",\n    implication: \"Your best people make conservative decisions by default, or stop making them at all. Momentum is a perishable asset.\"\n  },\n  {\n    num: 2,\n    eyebrow: \"Sign Two\",\n    tagline: \"The Story Has Fragmented\",\n    title: \"Your brand says one thing. Your pitch deck says another. Your team describes the company a third way.\",\n    body: \"As the product evolved and new voices joined, the narrative quietly fractured. The website reflects twelve months ago. The deck reflects your last investor. Your VP of Sales has a version that converts better but diverges from both.\",\n    implication: \"Sophisticated buyers notice before you walk in. They don't tell you. They just pass.\"\n  },\n  {\n    num: 3,\n    eyebrow: \"Sign Three\",\n    tagline: \"The Gap Between Stages\",\n    title: \"You've raised capital but can't yet justify a full-time C-suite hire.\",\n    body: \"You have capital, but burning it on a $250K+ COO or CMO before the revenue justifies it feels reckless. At the same time, you need senior operational thinking to reach the milestone that <em>would<\u002Fem> justify those hires. So the gap persists.\",\n    implication: \"The next funding round requires operational maturity you can't yet demonstrate. Investors fund teams, not just ideas.\"\n  },\n  {\n    num: 4,\n    eyebrow: \"Sign Four\",\n    tagline: \"Momentum Dies in the Middle\",\n    title: \"A key partnership, deal, or initiative stalled because nobody owned the follow-through.\",\n    body: \"The meeting went well. There was genuine interest on both sides. And then nothing — not a rejection, just drift. Strategic opportunities exist in windows. There's no one whose primary job is holding the thread while you manage everything else.\",\n    implication: \"Count the deals in your pipeline that have gone quiet in the last 90 days. Each one is a compounding loss.\"\n  },\n  {\n    num: 5,\n    eyebrow: \"Sign Five\",\n    tagline: \"Execution Without Coherence\",\n    title: \"Your team is executing. But nobody is synthesizing — strategy has gone implicit.\",\n    body: \"Work is getting done. Deliverables ship. But when you ask whether you're making real progress on what matters this quarter, the answer is murky. Nobody is actively connecting daily effort to strategic objectives, or calling out drift when it happens.\",\n    implication: \"Teams that execute without strategic synthesis build technical debt in every direction. Quarter-end reviews that feel like archaeology are a reliable indicator.\"\n  },\n  {\n    num: 6,\n    eyebrow: \"Sign Six\",\n    tagline: \"The Founder-Led Sales Trap\",\n    title: \"You're the best salesperson in the company — and that's a structural problem.\",\n    body: \"Every deal that requires you in the room is a deal that can't be replicated or handed off. Your pipeline lives in your head. There's no CRM discipline because you are the CRM. The one time someone else tried to run a deal, it stalled.\",\n    implication: \"Founder-dependent revenue doesn't scale — and investors know it. You've become un-promotable in your own company.\"\n  },\n  {\n    num: 7,\n    eyebrow: \"Sign Seven\",\n    tagline: \"Vision Outrunning Narrative\",\n    title: \"The gap between your vision and your market positioning is widening, not closing.\",\n    body: \"You can see where the company is going with unusual clarity. But the world encounters the company you <em>were<\u002Fem>, not the one you're building. You spend energy re-contextualizing in every important conversation before you can get to the actual opportunity.\",\n    implication: \"Companies get categorized early — and those categories are sticky. Competitors with weaker ideas but stronger positioning gain ground you'll have to buy back.\"\n  }\n];\n\nconst TIERS = {\n  none: {\n    label: \"Clear\",\n    colorClass: \"c-low\",\n    desc: \"None of the seven signs are currently active — you're operating with strong foundational structure, or you're beyond this guide's target stage. Keep the patterns in mind as you scale.\"\n  },\n  low: {\n    label: \"Early Warning\",\n    colorClass: \"c-low\",\n    desc: \"The ceiling is visible but not yet structural. These are the moments where a focused investment in operational clarity pays disproportionate dividends. <strong>Address the specific signs now, before they compound into each other.<\u002Fstrong>\"\n  },\n  mid: {\n    label: \"Active Drag\",\n    colorClass: \"c-mid\",\n    desc: \"Multiple signs are combining to create real friction. You're leaving meaningful value on the table — in deals that went quiet, hires that took too long, strategy that's gone implicit. <strong>A conversation is worth having now.<\u002Fstrong>\"\n  },\n  high: {\n    label: \"Structural Problem\",\n    colorClass: \"c-high\",\n    desc: \"The operational layer is the constraint — not your vision, not the market. This is solvable, but it needs dedicated attention, not marginal time from an already-overextended founder. <strong>This is exactly what I was built to address.<\u002Fstrong>\"\n  }\n};\n\nfunction getTier(score) {\n  if (score === 0) return TIERS.none;\n  if (score <= 2)  return TIERS.low;\n  if (score <= 4)  return TIERS.mid;\n  return TIERS.high;\n}\n\nlet step    = -1;\nlet answers = new Array(7).fill(null);\nconst root  = document.getElementById('quiz');\n\nfunction transition(fn) {\n  root.style.opacity   = '0';\n  root.style.transform = 'translateY(8px)';\n  setTimeout(() => {\n    fn();\n    root.offsetHeight;\n    root.style.opacity   = '1';\n    root.style.transform = 'translateY(0)';\n  }, 180);\n}\n\nfunction render() {\n  if (step === -1)   renderIntro();\n  else if (step < 7) renderQuestion(step);\n  else               renderResults();\n}\n\nfunction start()     { step = 0; transition(render); }\nfunction answer(val) { answers[step] = val; step++; transition(render); }\nfunction back()      { step = step <= 0 ? -1 : step - 1; transition(render); }\nfunction retake()    { step = -1; answers = new Array(7).fill(null); transition(render); }\n\nfunction renderIntro() {\n  root.innerHTML = `\n    <div class=\"q-intro\">\n      <svg class=\"constellation\" viewBox=\"0 0 600 480\" preserveAspectRatio=\"xMidYMid slice\" aria-hidden=\"true\">\n        <line x1=\"420\" y1=\"60\" x2=\"540\" y2=\"140\" stroke=\"#22d4f5\" stroke-width=\"0.6\" stroke-opacity=\"0.3\"/>\n        <line x1=\"540\" y1=\"140\" x2=\"480\" y2=\"260\" stroke=\"#22d4f5\" stroke-width=\"0.6\" stroke-opacity=\"0.25\"/>\n        <line x1=\"480\" y1=\"260\" x2=\"560\" y2=\"360\" stroke=\"#22d4f5\" stroke-width=\"0.6\" stroke-opacity=\"0.2\"/>\n        <line x1=\"420\" y1=\"60\" x2=\"480\" y2=\"260\" stroke=\"#22d4f5\" stroke-width=\"0.6\" stroke-opacity=\"0.15\"/>\n        <line x1=\"540\" y1=\"140\" x2=\"580\" y2=\"220\" stroke=\"#22d4f5\" stroke-width=\"0.6\" stroke-opacity=\"0.18\"/>\n        <line x1=\"480\" y1=\"260\" x2=\"420\" y2=\"380\" stroke=\"#22d4f5\" stroke-width=\"0.6\" stroke-opacity=\"0.15\"/>\n        <circle cx=\"420\" cy=\"60\"  r=\"2.5\" fill=\"#22d4f5\" opacity=\"0.55\"/>\n        <circle cx=\"540\" cy=\"140\" r=\"3\"   fill=\"#22d4f5\" opacity=\"0.5\"/>\n        <circle cx=\"480\" cy=\"260\" r=\"4\"   fill=\"#22d4f5\" opacity=\"0.45\"/>\n        <circle cx=\"560\" cy=\"360\" r=\"2\"   fill=\"#22d4f5\" opacity=\"0.35\"/>\n        <circle cx=\"580\" cy=\"220\" r=\"1.5\" fill=\"#22d4f5\" opacity=\"0.3\"/>\n        <circle cx=\"420\" cy=\"380\" r=\"2\"   fill=\"#22d4f5\" opacity=\"0.4\"/>\n        <circle cx=\"480\" cy=\"260\" r=\"20\"  fill=\"#22d4f5\" fill-opacity=\"0.04\"/>\n      <\u002Fsvg>\n\n      <div class=\"intro-top\">\n        <div class=\"intro-eyebrow\">Self-Assessment &middot; 7 Questions &middot; ~3 Minutes<\u002Fdiv>\n        <div class=\"intro-divider\"><\u002Fdiv>\n        <div class=\"intro-title\">\n          The Founder's\n          <span class=\"cyan\">Ceiling<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"intro-sub\">Are these signs active in your company?<\u002Fdiv>\n        <p class=\"intro-body\">Most startups don't stall because the idea is wrong. They stall because <strong>the operational layer never kept pace with the vision.<\u002Fstrong> Seven signs. One score. Find out where you stand.<\u002Fp>\n        <button class=\"btn-start\" onclick=\"start()\">\n          start the assessment\n          <svg width=\"14\" height=\"14\" viewBox=\"0 0 14 14\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n            <path d=\"M2 7h10\"/><path d=\"M8 3l4 4-4 4\"/>\n          <\u002Fsvg>\n        <\u002Fbutton>\n      <\u002Fdiv>\n\n      <div class=\"intro-author\">\n        <div>\n          <div class=\"intro-author-name\">Jeff Hallstead<\u002Fdiv>\n          <div class=\"intro-author-role\">Fractional CEO &middot; Co-Founder &middot; Strategic Operator<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"intro-url\">jeffhallstead.com<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  `;\n}\n\nfunction renderQuestion(i) {\n  const s        = SIGNS[i];\n  const pct      = Math.round(((i + 1) / 7) * 100);\n  const yesClass = answers[i] === true  ? ' selected' : '';\n  const noClass  = answers[i] === false ? ' selected' : '';\n\n  root.innerHTML = `\n    <div class=\"q-progress\">\n      <div class=\"q-progress-label\">Question<\u002Fdiv>\n      <div class=\"q-progress-track\">\n        <div class=\"q-progress-fill\" style=\"width:${pct}%\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"q-progress-count\">${i + 1} / 7<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"q-card\">\n      <div class=\"q-eyebrow\">${s.eyebrow}<\u002Fdiv>\n      <div class=\"q-num\">0${s.num}<\u002Fdiv>\n      <div class=\"q-title\">${s.title}<\u002Fdiv>\n      <div class=\"q-tagline\">${s.tagline}<\u002Fdiv>\n      <div class=\"q-rule\"><\u002Fdiv>\n      <div class=\"q-body\">${s.body}<\u002Fdiv>\n      <div class=\"q-answers\">\n        <button class=\"btn-answer yes${yesClass}\" onclick=\"answer(true)\">yes — this is happening<\u002Fbutton>\n        <button class=\"btn-answer no${noClass}\" onclick=\"answer(false)\">not currently<\u002Fbutton>\n      <\u002Fdiv>\n      <button class=\"q-back\" onclick=\"back()\">\n        <svg width=\"12\" height=\"12\" viewBox=\"0 0 12 12\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n          <path d=\"M10 6H2\"/><path d=\"M5 2L1 6l4 4\"/>\n        <\u002Fsvg>\n        ${i === 0 ? 'back to start' : 'previous'}\n      <\u002Fbutton>\n    <\u002Fdiv>\n  `;\n}\n\nfunction renderResults() {\n  const score        = answers.filter(Boolean).length;\n  const tier         = getTier(score);\n  const checkedSigns = SIGNS.filter((_, i) => answers[i] === true);\n\n  const signListHTML = checkedSigns.length === 0\n    ? `<div class=\"result-none\">None of the seven signs are currently active in your company. You're operating with strong foundational structure — or you're further along than this guide's target stage. Keep the patterns in mind as you scale.<\u002Fdiv>`\n    : `<ul class=\"sign-result-list\">\n        ${checkedSigns.map(s => `\n          <li class=\"sign-result-item\">\n            <div class=\"sign-result-num\">${s.num}<\u002Fdiv>\n            <div>\n              <div class=\"sign-result-tagline\">${s.tagline}<\u002Fdiv>\n              <div class=\"sign-result-implication\">${s.implication}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fli>\n        `).join('')}\n       <\u002Ful>`;\n\n  const cta = score >= 5\n    ? {\n        eyebrow: \"5 or More Signs Checked\",\n        heading: `Let's Talk About What's Actually <em>In the Way<\u002Fem>`,\n        body: \"The first call is 45 minutes. No pitch deck. I'll give you a candid read on the pattern I'm seeing across your specific signs — and what the highest-leverage move looks like right now.\"\n      }\n    : score >= 3\n    ? {\n        eyebrow: \"3 or More Signs Checked\",\n        heading: `A 45-Minute Conversation Is <em>Worth Having Now<\u002Fem>`,\n        body: \"Multiple signs are combining to create real friction. I'll give you my honest read on what the pattern means in your specific context, and whether there's a fit worth pursuing.\"\n      }\n    : score >= 1\n    ? {\n        eyebrow: \"Early Signs Are Worth Addressing\",\n        heading: `Worth a Conversation <em>Before It Compounds<\u002Fem>`,\n        body: \"Early-stage patterns are the easiest to address. A quick call lets me give you a read on whether what you're seeing is likely to compound — and what to do about it now.\"\n      }\n    : {\n        eyebrow: \"You're in Good Shape\",\n        heading: `Let's Keep <em>It That Way<\u002Fem>`,\n        body: \"The best time to build operational structure is before you need it urgently. If you're curious about what the next stage typically looks like, I'm happy to share what I'm seeing.\"\n      };\n\n  root.innerHTML = `\n    <div class=\"results-header\">\n      <div class=\"results-eyebrow\">Your Results<\u002Fdiv>\n      <div class=\"results-divider\"><\u002Fdiv>\n      <div class=\"results-score-row\">\n        <div class=\"results-score-num ${tier.colorClass}\">${score}<\u002Fdiv>\n        <div class=\"results-score-denom\">/ 7<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"results-tier-badge\">\n        <div class=\"results-tier-name ${tier.colorClass}\">${tier.label}<\u002Fdiv>\n      <\u002Fdiv>\n      <p class=\"results-tier-desc\">${tier.desc}<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"results-body\">\n      <div class=\"results-body-label\">Signs You Identified<\u002Fdiv>\n      ${signListHTML}\n    <\u002Fdiv>\n    <div class=\"results-cta\">\n      <div class=\"results-cta-eyebrow\">${cta.eyebrow}<\u002Fdiv>\n      <div class=\"results-cta-divider\"><\u002Fdiv>\n      <div class=\"results-cta-heading\">${cta.heading}<\u002Fdiv>\n      <p class=\"results-cta-body\">${cta.body}<\u002Fp>\n      <div>\n        <a href=\"../contact.html\" class=\"results-cta-btn\">start a conversation<\u002Fa>\n      <\u002Fdiv>\n      <div class=\"results-cta-sub\">jeffhallstead.com/contact &middot; No commitment required<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"results-retake\">\n      <button class=\"btn-retake\" onclick=\"retake()\">retake the assessment<\u002Fbutton>\n    <\u002Fdiv>\n  `;\n}\n\nrender();\n<\u002Fscript>\n\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>

<script>
(function() {
  var GATE_CSS = [
    '.fc-gate{max-width:480px;margin:0 auto;padding:24px 0 32px;}',
    '.fc-gate-eyebrow{font-family:"DM Mono",monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:rgba(34,212,245,.8);margin-bottom:14px;display:flex;align-items:center;gap:12px;}',
    '.fc-gate-eyebrow::after{content:"";flex:1;height:1px;background:rgba(34,212,245,.2);}',
    '.fc-gate h2{font-family:"Barlow",sans-serif;font-weight:300;font-size:clamp(22px,4vw,30px);color:#fff;margin-bottom:10px;line-height:1.2;}',
    '.fc-gate p{font-size:14px;color:rgba(255,255,255,.6);margin-bottom:22px;line-height:1.6;font-family:-apple-system,BlinkMacSystemFont,sans-serif;}',
    '.fc-field{display:block;width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.15);color:#fff;font-size:15px;padding:13px 16px;border-radius:2px;margin-bottom:10px;font-family:-apple-system,BlinkMacSystemFont,sans-serif;box-sizing:border-box;transition:border-color .2s;}',
    '.fc-field:focus{outline:none;border-color:rgba(34,212,245,.5);}',
    '.fc-field::placeholder{color:rgba(255,255,255,.3);}',
    '.fc-btn-row{display:flex;align-items:center;gap:18px;margin-top:8px;}',
    '.fc-submit-btn{display:inline-block;padding:13px 26px;background:none;border:1.5px solid rgba(232,76,43,.5);color:rgba(255,255,255,.9);font-family:-apple-system,BlinkMacSystemFont,sans-serif;font-size:13px;letter-spacing:.06em;cursor:pointer;border-radius:2px;transition:background .2s,border-color .2s;}',
    '.fc-submit-btn:hover{background:rgba(232,76,43,.12);border-color:rgba(232,76,43,.8);}',
    '.fc-skip-btn{background:none;border:none;color:rgba(255,255,255,.35);font-size:12px;cursor:pointer;text-decoration:underline;text-underline-offset:3px;font-family:-apple-system,BlinkMacSystemFont,sans-serif;padding:0;}',
    '.fc-skip-btn:hover{color:rgba(255,255,255,.6);}',
  ].join('');

  function injectStyles() {
    if (document.getElementById('fc-gate-styles')) return;
    var s = document.createElement('style');
    s.id = 'fc-gate-styles';
    s.textContent = GATE_CSS;
    document.head.appendChild(s);
  }

  function hookGate() {
    if (typeof window.renderResults !== 'function') return false;
    var _orig = window.renderResults;

    window.renderResults = function() {
      // Render the real results first (hidden)
      _orig();

      var root = document.getElementById('quiz');
      if (!root) return;

      // Inject CSS now that we're in the live document
      injectStyles();

      // Read result data from the rendered DOM
      var scoreEl = root.querySelector('.results-score-num');
      var tierEl  = root.querySelector('.results-tier-name');
      var signEls = root.querySelectorAll('.sign-result-tagline');
      var score   = scoreEl ? parseInt(scoreEl.textContent.trim()) : 0;
      var tier    = tierEl  ? tierEl.textContent.trim() : '';
      var signs   = Array.from(signEls).map(function(el) { return el.textContent.trim(); }).join(', ');

      // Wrap results and prepend gate
      var resultsHTML = root.innerHTML;
      root.innerHTML =
        '<div class="fc-gate" id="fc-gate-wrap">' +
          '<div class="fc-gate-eyebrow">Your Results Are Ready</div>' +
          '<h2>Where should we send your results?</h2>' +
          '<p>Optional — skip to go straight to your results.</p>' +
          '<input class="fc-field" id="fc-name"    type="text"  placeholder="Your name"           autocomplete="name">' +
          '<input class="fc-field" id="fc-email"   type="email" placeholder="Email address"       autocomplete="email">' +
          '<input class="fc-field" id="fc-website" type="url"   placeholder="Website (optional)"  autocomplete="url">' +
          '<div class="fc-btn-row">' +
            '<button class="fc-submit-btn" id="fc-submit">view my results →</button>' +
            '<button class="fc-skip-btn"   id="fc-skip">skip</button>' +
          '</div>' +
        '</div>' +
        '<div id="fc-results-wrap" style="display:none;">' + resultsHTML + '</div>';

      function proceed() {
        var gate = document.getElementById('fc-gate-wrap');
        var res  = document.getElementById('fc-results-wrap');
        if (gate) gate.remove();
        if (res)  res.style.display = '';
      }

      document.getElementById('fc-submit').addEventListener('click', function() {
        var name    = (document.getElementById('fc-name').value    || '').trim();
        var email   = (document.getElementById('fc-email').value   || '').trim();
        var website = (document.getElementById('fc-website').value || '').trim();
        if (!email) { document.getElementById('fc-email').focus(); return; }

        fetch('/.netlify/functions/submit-founders-ceiling', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: name, email: email, website: website, score: score, tier: tier, signsTriggered: signs }),
        }).catch(function() {});

        proceed();
      });

      document.getElementById('fc-skip').addEventListener('click', proceed);
    };

    return true;
  }

  var attempts = 0;
  var iv = setInterval(function() {
    attempts++;
    if (hookGate() || attempts > 60) clearInterval(iv);
  }, 200);
})();
</script>
</body>
</html>
